<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Face TMS" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<title>Face TMS — 人脸考勤系统</title>
<style>
    :root {
        --bg: #0f172a;
        --bg2: #1e293b;
        --card: #1e293b;
        --line: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
        --in: #22c55e;
        --out: #f43f5e;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(160deg, var(--bg), #0b1120);
        color: var(--text);
        display: flex; flex-direction: column;
        min-height: 100vh;
    }
    header {
        padding: calc(12px + var(--safe-top)) 16px 12px;
        display: flex; align-items: center; gap: 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
        position: sticky; top: 0; z-index: 20;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 700; }
    header .logo { display: inline-flex; color: var(--accent); }
    header .logo .ico { width: 24px; height: 24px; }
    header .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    header .lang-btn { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--text); font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
    header .lang-btn + .pill { margin-left: 8px; }
    header .lang-btn:active { transform: scale(.96); }

    main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: 16px; }

    .panel { display: none; animation: fade .2s ease; }
    .panel.show { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ---------- 摄像头 ---------- */
    .stage {
        position: relative; width: 100%; aspect-ratio: 4 / 3;
        background: #000; border-radius: 16px; overflow: hidden;
        border: 1px solid var(--line);
    }
    .stage video, .stage canvas {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .stage video { transform: scaleX(-1); }   /* 仅镜像视频，更自然 */
    /* canvas 不镜像：绘制时手动翻转 x，文字才能正常阅读 */
    .stage canvas { pointer-events: none; }

    /* ---------- 打卡卡片 ---------- */
    .clock-hint { text-align: center; color: var(--muted); margin: 14px 0; min-height: 20px; }
    .clock-card {
        display: none; flex-direction: column; align-items: center; gap: 14px;
        background: var(--card); border: 1px solid var(--line); border-radius: 16px;
        padding: 20px; margin-top: 14px;
    }
    .clock-card.show { display: flex; animation: fade .2s; }
    .clock-avatar {
        width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
        font-size: 36px; font-weight: 700; color: #001; background: var(--accent);
    }
    .clock-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transform: scaleX(-1); }
    .clock-avatar.in { background: var(--in); }
    .clock-avatar.out { background: var(--out); color: #fff; }
    .clock-avatar.ok { background: var(--in); }
    .clock-meta { text-align: center; }
    .clock-name { font-size: 22px; font-weight: 700; }
    .clock-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .clock-action {
        width: 100%; max-width: 340px; padding: 16px; font-size: 18px; font-weight: 700;
        border: none; border-radius: 14px; color: #fff; cursor: pointer;
    }
    .clock-action.in { background: var(--in); }
    .clock-action.out { background: var(--out); }
    .clock-action:active { transform: scale(.98); }
    .clock-badge { font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .clock-badge.ok { color: var(--in); }

    /* ---------- 员工 ---------- */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
        background: #0b1120; color: var(--text); font-size: 16px;
    }
    .btn {
        width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
        color: #001; background: var(--accent); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: scale(.99); }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: transparent; color: var(--out); border: 1px solid var(--out); }

    /* ---------- 看板 ---------- */
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 12px; text-align: center; }
    .stat-num { font-size: 32px; font-weight: 800; color: var(--accent); }
    .stat-num.warn { color: var(--out); }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 160px; padding-top: 8px; }
    .chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .chart .bar { width: 70%; max-width: 36px; background: linear-gradient(180deg, var(--accent), #0891b2); border-radius: 6px 6px 0 0; min-height: 2px; transition: height .3s; }
    .chart .bar-val { font-size: 10px; color: var(--muted); }
    .chart .bar-day { font-size: 11px; color: var(--muted); }
    .whos-in-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .whos-in-row:last-child { border-bottom: none; }
    .whos-in-time { margin-left: auto; font-size: 13px; color: var(--in); font-weight: 600; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .card h2 .ico { color: var(--accent); }

    .emp-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .emp-row:last-child { border-bottom: none; }
    .emp-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; font-weight: 700; color: var(--accent); overflow: hidden; flex-shrink: 0; }
    .emp-avatar img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .emp-avatar.has-photo { cursor: pointer; }
    .emp-info { flex: 1; min-width: 0; }
    .emp-name { font-weight: 600; }
    .emp-meta { font-size: 12px; color: var(--muted); }
    .emp-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .emp-action { background: transparent; border: 1px solid transparent; color: var(--text); font-size: 17px; cursor: pointer; padding: 7px; border-radius: 8px; min-width: 34px; line-height: 1; }
    .emp-action:hover, .emp-action:focus-visible { border-color: var(--line); background: rgba(255,255,255,.04); outline: none; }
    .emp-action.danger { color: var(--out); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }

    /* ---------- 记录 ---------- */
    .summary { background: var(--bg2); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--text); margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .cell-in { color: var(--in); font-weight: 600; }
    .cell-out { color: var(--out); font-weight: 600; }
    .cell-muted { color: var(--muted); }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-badge.late { background: rgba(244,63,94,.18); color: #fb7185; }
    .status-badge.early { background: rgba(255,165,2,.18); color: #ffb454; }
    .status-badge.overtime { background: rgba(34,211,238,.18); color: var(--accent); }
    .sched-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sched-grid .field:last-child { grid-column: 1 / -1; }
    .field input[type="time"], .field input[type="number"] { color-scheme: dark; }
    .row-actions { display: flex; gap: 10px; margin-top: 12px; }
    .row-actions .btn { flex: 1; }

    /* ---------- 开关（防伪等设置项） ---------- */
    .toggle-row { display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .toggle-row > div { flex: 1; min-width: 0; }
    .toggle-title { font-weight: 600; }
    .toggle-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .switch {
        appearance: none; -webkit-appearance: none; flex-shrink: 0;
        width: 48px; height: 28px; border-radius: 999px; background: var(--line);
        position: relative; cursor: pointer; transition: background .2s;
    }
    .switch:checked { background: var(--in); }
    .switch::after {
        content: ''; position: absolute; top: 3px; left: 3px;
        width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s;
    }
    .switch:checked::after { transform: translateX(20px); }

    /* ---------- 底部导航 ---------- */
    nav {
        position: sticky; bottom: 0; z-index: 20;
        display: flex; border-top: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);
        padding-bottom: var(--safe-bot);
    }
    nav button {
        flex: 1; background: transparent; border: none; color: var(--muted);
        padding: 10px 0 8px; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    nav button .ico { width: 24px; height: 24px; }
    nav button.active { color: var(--accent); }

    /* ---------- 注册弹层 ---------- */
    .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.7); }
    .modal.show { display: flex; }
    .modal-card { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    .modal-card h3 { margin: 0 0 12px; }
    .modal-card.standard {
        max-width: 560px; max-height: min(82vh, 720px); padding: 0; overflow: hidden;
        display: flex; flex-direction: column;
    }
    .modal-card.wide { max-width: 760px; }
    .modal-head {
        display: flex; align-items: center; gap: 12px; padding: 16px 18px;
        border-bottom: 1px solid var(--line); background: rgba(15, 23, 42, .65);
    }
    .modal-head h3 { margin: 0; font-size: 17px; flex: 1; min-width: 0; }
    .modal-close { width: 36px; height: 36px; display: grid; place-items: center; background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
    .modal-close:hover, .modal-close:focus-visible { color: var(--text); border-color: var(--line); outline: none; }
    .modal-body { padding: 18px; overflow: auto; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line); background: rgba(15, 23, 42, .55); }
    .modal-actions .btn { width: auto; min-width: 112px; }
    .modal-form { display: grid; gap: 12px; }
    .capture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
    .capture-tile { margin: 0; }
    .capture-tile img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #000; border: 1px solid var(--line); }
    .capture-tile figcaption { color: var(--muted); font-size: 11px; margin-top: 4px; text-align: center; }
    .modal-note { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 12px; }
    .bar { height: 8px; background: #0b1120; border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .enroll-text { text-align: center; color: var(--muted); font-size: 13px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .thumbs img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }

    /* ---------- AI 核验弹层 ---------- */
    .lm-card { text-align: center; }
    .lm-badge { line-height: 1; margin: 4px 0 6px; display: flex; justify-content: center; color: var(--accent); }
    .lm-badge .ico { width: 46px; height: 46px; }
    .lm-card.ok  .lm-badge { color: var(--in); }
    .lm-card.bad .lm-badge { color: var(--out); }
    .lm-card.warn .lm-badge { color: #fbbf24; }
    .lm-title { margin: 0 0 4px; font-size: 18px; }
    .lm-frames { justify-content: center; }
    .lm-frames img { width: 108px; height: 81px; }           /* 送审整帧：放大些，让用户看清送了什么去核验 */
    /* loading：不确定进度的来回滑块 */
    .bar > div.indet { width: 38%; border-radius: 999px; animation: lmSlide 1.1s ease-in-out infinite; }
    @keyframes lmSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(285%); } }
    /* 结果配色：真人=绿 / 伪造=红 / 放行=黄 */
    .lm-card.ok  .bar > div { background: var(--in); }
    .lm-card.bad .bar > div { background: var(--out); }
    .lm-card.warn .bar > div { background: #fbbf24; }
    .lm-card.ok  .lm-title { color: var(--in); }
    .lm-card.bad .lm-title { color: var(--out); }

    /* ---------- 全局提示 / 更新条 ---------- */
    .toast {
        position: fixed; left: 50%; bottom: calc(80px + var(--safe-bot)); transform: translateX(-50%) translateY(20px);
        background: #0b1120; border: 1px solid var(--line); color: var(--text);
        padding: 12px 18px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none;
        transition: .25s; z-index: 60; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--in); }
    .toast.err { border-color: var(--out); }

    .update-banner {
        position: fixed; top: calc(8px + var(--safe-top)); left: 50%; transform: translateX(-50%);
        display: none; align-items: center; gap: 10px; z-index: 70;
        background: var(--accent); color: #001; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
        box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    .update-banner.show { display: flex; }
    .update-banner button { background: #001; color: #fff; border: none; padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; }

    /* ---------- 启动遮罩 ---------- */
    .boot { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .4s; }
    .boot.hidden { opacity: 0; pointer-events: none; }
    .boot .ring { width: 48px; height: 48px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boot .b-title { font-size: 18px; font-weight: 700; }
    .boot .b-status { color: var(--muted); font-size: 13px; max-width: 80vw; text-align: center; }

    /* ---------- iPad / 桌面：两栏化打卡页 ---------- */
    @media (min-width: 820px) {
        nav { display: none; }
        header .tabs { display: flex; gap: 6px; margin-left: 24px; }
        header .tabs button { background: transparent; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 6px 12px; border-radius: 8px; }
        header .tabs button.active { color: var(--accent); background: var(--bg2); }
        main { padding: 24px; }
        #panel-clock .clock-wrap { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
        #panel-clock .clock-card { margin-top: 0; }
    }
    @media (max-width: 819px) { header .tabs { display: none; } }

    /* ---------- SVG 图标（统一描边，颜色随 currentColor） ---------- */
    .ico {
        width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -0.16em; flex-shrink: 0;
        fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .ico.dot { fill: currentColor; stroke: none; width: .68em; height: .68em; vertical-align: 0; }
    .emp-action .ico { width: 18px; height: 18px; }
</style>
</head>
<body>

        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
    </defs>
</svg>

<div class="boot" id="bootOverlay">
    <div class="ring"></div>
    <div class="b-title">Face TMS</div>
    <div class="b-status" id="bootStatus" data-i18n="boot_loading">加载中…</div>
</div>

<div class="update-banner" id="updateBanner">
    <span data-i18n="update_available">有新版本</span> <button id="reloadBtn" data-i18n="update_now">立即更新</button>
</div>

<header>
    <span class="logo"><svg class="ico"><use href="#i-clock"/></svg></span>
    <h1>Face TMS</h1>
    <div class="tabs">
        <button data-tab="clock" class="active" data-i18n="tab_clock">打卡</button>
        <button data-tab="dashboard" data-i18n="tab_dashboard">看板</button>
        <button data-tab="employees" data-i18n="tab_employees">员工</button>
        <button data-tab="records" data-i18n="tab_records">记录</button>
    </div>
    <button class="lang-btn" id="langBtn">EN</button>
    <span class="pill" id="empCountPill">0</span>
</header>

<main>
    <!-- ===== 打卡 ===== -->
    <section class="panel show" id="panel-clock">
        <div class="clock-wrap">
            <div class="stage">
                <video id="clockVideo" playsinline muted autoplay></video>
                <canvas id="clockOverlay"></canvas>
            </div>
            <div>
                <div class="clock-hint" id="clockHint" data-i18n="clock_face_camera">请正对镜头…</div>
                <div class="clock-card" id="clockCard"></div>
            </div>
        </div>
    </section>

    <!-- ===== 看板 ===== -->
    <section class="panel" id="panel-dashboard">
        <div class="stat-row">
            <div class="stat"><div class="stat-num" id="statInNow">0</div><div class="stat-label" data-i18n="dash_in_now">在岗</div></div>
            <div class="stat"><div class="stat-num warn" id="statLate">0</div><div class="stat-label" data-i18n="dash_late_today">今日迟到</div></div>
            <div class="stat"><div class="stat-num" id="statStaff">0</div><div class="stat-label" data-i18n="dash_total_staff">员工总数</div></div>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-users"/></svg><span data-i18n="dash_whos_in">当前在岗</span></h2>
            <div id="whosInList"></div>
            <div class="empty" id="whosInEmpty" data-i18n="dash_nobody_in">当前无人在岗。</div>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-trending"/></svg><span data-i18n="dash_weekly_hours">近 7 天工时</span></h2>
            <div id="weeklyChart" class="chart"></div>
        </div>
    </section>

    <!-- ===== 员工 ===== -->
    <section class="panel" id="panel-employees">
        <div class="card">
            <h2><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="emp_register_title">注册新员工</span></h2>
            <div class="field">
                <label data-i18n="label_name">姓名</label>
                <input id="empName" type="text" data-i18n-ph="ph_name" placeholder="如：张三" autocomplete="off" />
            </div>
            <div class="field">
                <label data-i18n="label_dept">部门（选填）</label>
                <input id="empDept" type="text" data-i18n-ph="ph_dept" placeholder="如：研发部" autocomplete="off" />
            </div>
            <button class="btn" id="enrollBtn"><svg class="ico"><use href="#i-camera"/></svg><span data-i18n="enroll_btn">采集人脸并注册</span></button>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-users"/></svg><span data-i18n="emp_list_title">已注册员工</span></h2>
            <div id="empList"></div>
            <div class="empty" id="empEmpty" data-i18n="emp_empty">还没有员工，先注册一个吧。</div>
        </div>
    </section>

    <!-- ===== 记录 ===== -->
    <section class="panel" id="panel-records">
        <div class="card">
            <h2><svg class="ico"><use href="#i-clipboard"/></svg><span data-i18n="records_title">考勤记录</span></h2>
            <div class="summary" id="recordsSummary" data-i18n="no_hours">今日暂无完整工时记录</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th data-i18n="th_emp">员工</th><th data-i18n="th_type">类型</th><th data-i18n="th_date">日期</th><th data-i18n="th_time">时间</th><th data-i18n="th_status">状态</th></tr>
                    </thead>
                    <tbody id="recordsBody"></tbody>
                </table>
            </div>
            <div class="empty" id="recordsEmpty" data-i18n="records_empty">暂无打卡记录。</div>
            <div class="row-actions">
                <button class="btn ghost" id="exportCsvBtn"><svg class="ico"><use href="#i-download"/></svg><span data-i18n="export_csv">导出 CSV</span></button>
                <button class="btn danger" id="clearRecordsBtn" data-i18n="clear_records">清空记录</button>
            </div>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-calendar"/></svg><span data-i18n="schedule_title">排班</span></h2>
            <div class="sched-grid">
                <div class="field">
                    <label data-i18n="work_start">上班时间</label>
                    <input id="workStartInput" type="time" />
                </div>
                <div class="field">
                    <label data-i18n="work_end">下班时间</label>
                    <input id="workEndInput" type="time" />
                </div>
                <div class="field">
                    <label data-i18n="grace_min">迟到宽限（分钟）</label>
                    <input id="graceInput" type="number" min="0" max="120" />
                </div>
            </div>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-settings"/></svg><span data-i18n="sensitivity_title">识别灵敏度</span></h2>
            <div class="field">
                <label id="thresholdLabel">匹配阈值 <span id="thresholdVal">0.50</span></label>
                <input id="thresholdInput" type="range" min="0.20" max="0.32" step="0.01" />
            </div>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-shield"/></svg><span data-i18n="security_title">防伪</span></h2>
            <label class="toggle-row" for="livenessToggle">
                <div>
                    <div class="toggle-title" data-i18n="liveness_label">混合活体检测</div>
                    <div class="toggle-desc" data-i18n="liveness_desc">开启后，打卡需通过随机动作挑战 + 被动纹理防伪。</div>
                </div>
                <input id="livenessToggle" type="checkbox" class="switch" />
            </label>
            <div id="vlmFields" style="display:none;">
                <div class="field" style="margin-top:14px;">
                    <label id="realProbLabel">AI 真人置信度阈值 <span id="realProbVal">0.50</span></label>
                    <input id="realProbInput" type="range" min="0.30" max="0.90" step="0.05" />
                </div>
                <div class="field">
                    <label data-i18n="vlm_endpoint_label">LM Studio API 地址</label>
                    <input id="vlmEndpointInput" type="text" autocomplete="off" placeholder="http://127.0.0.1:6501/v1" />
                </div>
                <div class="field">
                    <label data-i18n="vlm_model_label">视觉模型 id</label>
                    <input id="vlmModelInput" type="text" autocomplete="off" placeholder="minicpm-v-4.6" />
                </div>
            </div>
        </div>
        <div class="card">
            <h2><svg class="ico"><use href="#i-volume"/></svg><span data-i18n="sound_title">声音提示</span></h2>
            <label class="toggle-row" for="soundToggle">
                <div>
                    <div class="toggle-title" data-i18n="sound_master_label">打卡声音提示</div>
                    <div class="toggle-desc" data-i18n="sound_master_desc">打卡成功时播放提示音；可在下方单独开启语音播报姓名。</div>
                </div>
                <input id="soundToggle" type="checkbox" class="switch" />
            </label>
            <div id="soundFields">
                <label class="toggle-row" for="speakToggle" style="margin-top:16px;">
                    <div>
                        <div class="toggle-title" data-i18n="voice_enable_label">语音播报员工姓名</div>
                        <div class="toggle-desc" data-i18n="voice_enable_desc">使用浏览器内置语音合成（Web Speech API）。</div>
                    </div>
                    <input id="speakToggle" type="checkbox" class="switch" />
                </label>
                <div id="voiceFields">
                    <div class="field" style="margin-top:12px;">
                        <label data-i18n="voice_voice_label">语音</label>
                        <select id="voiceSelect" style="width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;margin-top:4px;"></select>
                    </div>
                    <button class="btn ghost" id="voiceTestBtn" style="margin-top:8px;"><svg class="ico"><use href="#i-volume"/></svg><span data-i18n="voice_test">测试</span></button>
                </div>
            </div>
        </div>
    </section>
</main>

<nav>
    <button data-tab="clock" class="active"><svg class="ico"><use href="#i-clock"/></svg><span data-i18n="tab_clock">打卡</span></button>
    <button data-tab="dashboard"><svg class="ico"><use href="#i-trending"/></svg><span data-i18n="tab_dashboard">看板</span></button>
    <button data-tab="employees"><svg class="ico"><use href="#i-users"/></svg><span data-i18n="tab_employees">员工</span></button>
    <button data-tab="records"><svg class="ico"><use href="#i-clipboard"/></svg><span data-i18n="tab_records">记录</span></button>
</nav>

<!-- 注册弹层 -->
<div class="modal" id="enrollModal">
    <div class="modal-card">
        <h3 id="enrollTitle">注册</h3>
        <div class="stage" style="aspect-ratio:4/3;">
            <video id="enrollVideo" playsinline muted autoplay></video>
            <canvas id="enrollOverlay"></canvas>
        </div>
        <div class="bar"><div id="enrollBar"></div></div>
        <div class="enroll-text" id="enrollText">0 / 0</div>
        <div class="thumbs" id="enrollThumbs"></div>
        <button class="btn ghost" id="enrollCancel" data-i18n="cancel">取消</button>
    </div>
</div>

<!-- 标准弹层（SSOT）：员工预览 / 编辑 / 确认共用 -->
<div class="modal" id="appModal" aria-hidden="true"></div>

<!-- AI 核验弹层：打卡前送大模型判真人/伪造，期间暂停检测、纯等待 -->
<div class="modal" id="livenessModal">
    <div class="modal-card lm-card" id="lmCard">
        <div class="lm-badge" id="lmBadge"><svg class="ico"><use href="#i-cpu"/></svg></div>
        <h3 class="lm-title" id="lmTitle">正在发送给 AI 核验…</h3>
        <div class="thumbs lm-frames" id="lmFrames"></div>
        <div class="bar"><div id="lmBar"></div></div>
        <div class="enroll-text" id="lmSub">正在确认你是真人，请稍候</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- 核心库（复用项目已有文件） -->
<script src="../../js/lib/tf.min.js"></script>
<script src="../../js/lib/tf-backend-wasm.js"></script>
<script src="../../js/lib/face-api.js"></script>
<script src="../../js/core/utils.js"></script>
<script src="../../js/core/FaceRegistrationManager.js"></script>
<script src="../../js/core/FaceMatcher.js"></script>

<!-- AI 视觉活体核验：MiniCPM-V 经本机 LM Studio（OpenAI 兼容），无需额外依赖。 -->

<!-- TMS 自己的存储与逻辑 -->
<script src="./js/tms-i18n.js"></script>
<script src="./js/tms-db.js"></script>
<script src="./js/tms-tracker.js"></script>
<script src="./js/tms-liveness.js"></script>
<script src="./js/tms-modal.js"></script>
<script src="./js/tms-app.js"></script>
</body>
</html>
